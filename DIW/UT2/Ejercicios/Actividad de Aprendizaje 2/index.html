<form action="#" method="post">
  <!-- Texto -->
  <label for="nombre">Nombre:</label>
  <input
    type="text"
    id="nombre"
    name="nombre"
    placeholder="Introduce tu nombre"
  />

  <br /><br />

  <!-- Email -->
  <label for="email">Correo electrónico:</label>
  <input type="email" id="email" name="email" />

  <br /><br />

  <!-- Contraseña -->
  <label for="password">Contraseña:</label>
  <input type="password" id="password" name="password" />

  <br /><br />

  <!-- Número -->
  <label for="edad">Edad:</label>
  <input type="number" id="edad" name="edad" min="0" max="100" />

  <br /><br />

  <!-- Fecha -->
  <label for="fecha">Fecha de nacimiento:</label>
  <input type="date" id="fecha" name="fecha" />

  <br /><br />

  <!-- Radio -->
  <p>Género:</p>
  <label> <input type="radio" name="genero" value="hombre" /> Hombre </label>
  <label> <input type="radio" name="genero" value="mujer" /> Mujer </label>

  <br /><br />

  <!-- Checkbox -->
  <label>
    <input type="checkbox" name="condiciones" checked />
    Acepto los términos y condiciones
  </label>

  <br /><br />

  <!-- Select -->
  <label for="pais">País:</label>
  <select id="pais" name="pais">
    <option value="es" selected>España</option>
    <option value="fr">Francia</option>
    <option value="it">Italia</option>
  </select>

  <br /><br />

  <!-- File -->
  <label for="archivo">Adjuntar archivo:</label>
  <input type="file" id="archivo" name="archivo" />

  <br /><br />

  <!-- Color -->
  <label for="color">Color favorito:</label>
  <input type="color" id="color" name="color" />

  <br /><br />

  <!-- Range -->
  <label for="nivel">Nivel de experiencia:</label>
  <input type="range" id="nivel" name="nivel" min="0" max="10" />

  <br /><br />

  <!-- Botón -->
  <input type="submit" value="Enviar formulario" />
</form>
