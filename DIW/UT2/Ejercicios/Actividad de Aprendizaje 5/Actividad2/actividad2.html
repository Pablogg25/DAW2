<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Contenedor fila */
      .row {
        border: 3px solid #000; /* borde negro grueso */
        margin-bottom: 20px;
        height: 120px;
        background-color: #f5f5f5; /* fondo suave para diferenciar filas */
      }

      /* Columnas */
      .col,
      [class^="col-"] {
        border: 3px dashed red; /* borde rojo discontinuo */
        background-color: #ffecec; /* fondo suave */
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      .row::before {
        content: "";
        display: block;
      }
    </style>
    <title>Actividad 2</title>
  </head>
  <body>
    <div class="row justify-content-start">
      <div class="col-3">Col 1</div>
      <div class="col-3">Col 2</div>
    </div>
    <div class="row justify-content-center">
      <div class="col-3">Col 1</div>
      <div class="col-3">Col 2</div>
    </div>
    <div class="row justify-content-end">
      <div class="col-3">Col 1</div>
      <div class="col-3">Col 2</div>
    </div>
    <div class="row justify-content-around">
      <div class="col-3">Col 1</div>
      <div class="col-3">Col 2</div>
    </div>
    <div class="row justify-content-between">
      <div class="col-3">Col 1</div>
      <div class="col-3">Col 2</div>
    </div>
  </body>
</html>
