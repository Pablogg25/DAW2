<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      /* Contenedor fila */
      .row {
        border: 3px solid #000; /* borde negro grueso */
        margin-bottom: 20px;
        height: 120px;
        background-color: #f5f5f5; /* fondo suave para diferenciar filas */
      }

      /* Columnas */
      .col,
      [class^="col-"] {
        border: 3px dashed red; /* borde rojo discontinuo */
        background-color: #ffecec; /* fondo suave */
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }

      .row::before {
        content: "";
        display: block;
      }
    </style>

    <title>Actividad 3</title>
  </head>
  <body>
    <div class="row align-items-center">
      <div class="col-1 offset-1">col-1</div>
      <div class="col-auto offset-1">auto</div>
      <div class="col offset-1">sin tamaño</div>
    </div>
    <br />
    <div class="row align-items-center">
      <div class="col-4 offset-4 text-center">Columna centrada manual</div>
    </div>

    <br />
    <div class="row align-items-center">
      <div class="col-2 offset-1">Posición 2</div>
      <div class="col-2 offset-5">Posición 8</div>
    </div>
    <br />
    <div class="row align-items-center">
      <div class="col-4 offset-1 offset-md-4 offset-lg-0 text-center">
        Responsive
      </div>
    </div>
  </body>
</html>
