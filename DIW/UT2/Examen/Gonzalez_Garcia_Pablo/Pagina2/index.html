<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TST – Página 2</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      :root {
        --primario: #0b3c49;
        --secundario: #e8f1f2;
        --acento: #00b8d4;
        --texto: #222;
      }

      body {
        font-family: "Montserrat", sans-serif;
      }

      /* NAV */
      .nav-link {
        color: white;
        padding: 10px 15px;
        transition: 0.3s;
      }
      .nav-link:hover {
        background: white;
        color: var(--primario);
      }

      /* HERO DIVIDIDO */
      .hero-left {
        background: var(--primario);
        color: white;
        padding: 80px 30px;
      }
      .hero-right img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* TARJETAS */
      .card-custom {
        background: var(--secundario);
        border: none;
        padding: 25px;
        border-radius: 8px;
        transition: 0.3s;
      }
      .card-custom:hover {
        background: var(--acento);
        color: white;
      }

      /* SMART WASTE */
      .bw:hover {
        filter: grayscale(100%);
      }

      /* BOTONES */
      .btn-custom {
        background: var(--primario);
        color: white;
        transition: 0.3s;
      }
      .btn-custom:hover {
        background: white;
        color: var(--primario);
        border: 1px solid var(--primario);
      }

      footer {
        background: #111;
        color: white;
        padding: 40px 0;
      }
    </style>
  </head>

  <body>
    <!-- NAV -->
    <nav class="navbar navbar-expand-md bg-dark navbar-dark py-3">
      <div class="container">
        <a class="navbar-brand" href="#">
          <img src="./recursos/recursos_web/logo_TST.png" height="40" />
        </a>

        <button
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#menu2"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse text-center" id="menu2">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
            <li class="nav-item"><a class="nav-link" href="#">I+D</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
          </ul>

          <input
            class="form-control w-25 d-none d-md-block"
            placeholder="Buscar"
          />
        </div>
      </div>
    </nav>

    <!-- HERO DIVIDIDO -->
    <section class="container-fluid">
      <div class="row">
        <div
          class="col-md-6 hero-left d-flex flex-column justify-content-center"
        >
          <h1 class="fw-bold">SOLUCIONES IoT A TU MEDIDA</h1>
          <p class="mt-3">
            Tecnología avanzada para ciudades y empresas inteligentes.
          </p>
          <button class="btn btn-custom mt-3">Comenzar</button>
        </div>

        <div class="col-md-6 hero-right p-0">
          <img src="./recursos/recursos_web/Smart_Water_1.png" alt="Hero" />
        </div>
      </div>
    </section>

    <!-- INTRO -->
    <section class="py-5 text-center">
      <div class="container">
        <h2>Innovación y experiencia</h2>
        <p class="mt-3">
          Más de una década desarrollando soluciones IoT reales.
        </p>
      </div>
    </section>

    <!-- TARJETAS -->
    <section class="container py-5">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card-custom">
            <img src="./recursos/recursos_web/Icono_1.png" />
            <h5 class="mt-3">Diseño Electrónico</h5>
            <p>Especialistas en RF y hardware IoT.</p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
