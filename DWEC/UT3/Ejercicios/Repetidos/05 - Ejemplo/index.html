<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejemplo</title>
    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header><h1>Ejemplo</h1></header>

    <!-- ============================
         USUARIOS
    ============================= -->
    <section id="usuariosSection">
      <h2>Usuarios</h2>

      <div class="acciones">
        <input type="text" id="buscadorUsuarios" placeholder="Buscar..." />
        <br />
        <label>Mujer</label>
        <input type="checkbox" id="mujer" />
        <label>Hombre</label>
        <input type="checkbox" id="hombre" />
        <button id="btnNuevoUsuario">Nuevo Usuario</button>
      </div>

      <div id="listaUsuarios"></div>
    </section>

    <!-- ============================
         POSTS
    ============================= -->
    <section id="postsSection">
      <h2>Posts del usuario seleccionado</h2>

      <div class="acciones">
        <input type="text" id="buscadorPosts" placeholder="Buscar..." />
        <button id="btnNuevoPost">Nuevo Post</button>
      </div>

      <div id="listaPosts"></div>
    </section>

    <!-- ============================
         COMENTARIOS
    ============================= -->
    <section id="comentariosSection">
      <h2>Comentarios del usuario seleccionado</h2>

      <div class="acciones">
        <input type="text" id="buscadorComentarios" placeholder="Buscar..." />
        <button id="btnNuevoComentario">Nuevo Comentario</button>
      </div>

      <div id="listaComentarios"></div>
    </section>

    <!-- ============================
         TODOS
    ============================= -->
    <section id="todosSection">
      <h2>Tareas del usuario seleccionado</h2>

      <div class="acciones">
        <input type="text" id="buscadorTodos" placeholder="Buscar..." />
        <button id="btnNuevoTodo">Nueva Tarea</button>
      </div>

      <div id="listaTodos"></div>
    </section>

    <!-- ============================
         ESTADO
    ============================= -->
    <section id="estadoSection">
      <h2>Estado</h2>
      <pre id="estado"></pre>
    </section>
  </body>
</html>
