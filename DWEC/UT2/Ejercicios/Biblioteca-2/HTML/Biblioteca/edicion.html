<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form
      id="form-biblioteca"
      data-entidad="biblioteca"
      data-accion="guardar"
      data-id="${
        this.#bibliotecaId
      }"
    >
      <div>
        <label>Nombre</label
        ><input
          name="nombre"
          value="${
          this.#nombre
        }"
        />
      </div>
      <div>
        <label>Ubicación</label
        ><input
          name="ubicacion"
          value="${
          this.#ubicacion
        }"
        />
      </div>
      <button type="submit">Guardar</button>
    </form>
    <h4>Libros en esta biblioteca</h4>
  </body>
</html>
