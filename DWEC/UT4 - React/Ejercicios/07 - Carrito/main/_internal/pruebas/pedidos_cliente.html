<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos - Pruebas API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-bottom: 20px;
        }

        header {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
            color: white;
            padding: 30px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffa726 0%, #fb8c00 100%);
            color: white;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .lineas-container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .linea-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #ffa726;
            border-radius: 3px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .info-box {
            background: #fff3e0;
            border: 1px solid #ffa726;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #e65100;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        thead {
            background: #ffa726;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        .pedido-card {
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fafafa;
            border-left: 4px solid #ffa726;
        }

        .pedido-card h3 {
            color: #ffa726;
            margin-bottom: 10px;
        }

        .estado-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .estado-pendiente {
            background: #fff3cd;
            color: #856404;
        }

        .estado-confirmado {
            background: #cfe2ff;
            color: #084298;
        }

        .estado-enviado {
            background: #d1e7dd;
            color: #0f5132;
        }

        .estado-cancelado {
            background: #f8d7da;
            color: #842029;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ffa726;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #resultado {
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .linea-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <header>
                <h1>📋 Mis Pedidos</h1>
                <p>Crea, visualiza y gestiona tus pedidos (autenticado)</p>
            </header>

            <div class="content">
                <div class="info-box">
                    <strong>ℹ️ Requiere autenticación:</strong> Debes estar logueado. Solo ves tus pedidos.
                </div>

                <!-- SECCIÓN 1: CREAR PEDIDO -->
                <section id="crear-pedido-section">
                    <h2 style="color: #333; margin-bottom: 20px;">✏️ Crear Nuevo Pedido</h2>

                    <div class="form-group">
                        <label for="direccion-envio">Dirección de Envío:</label>
                        <textarea id="direccion-envio" placeholder="Ej: Calle Principal 123, Apt 4B, Madrid"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="observaciones">Observaciones (opcional):</label>
                        <textarea id="observaciones" placeholder="Ej: Entregar entre 9am-5pm..."></textarea>
                    </div>

                    <h3 style="color: #333; margin: 20px 0 15px 0;">Productos a Pedir:</h3>

                    <div class="lineas-container" id="lineas-list">
                        <p style="color: #999;">Cargando productos...</p>
                    </div>

                    <div class="button-group">
                        <button class="btn-primary" onclick="crearPedido()">🛒 Crear Pedido</button>
                        <button class="btn-secondary" onclick="limpiarFormularioPedido()">🗑️ Limpiar</button>
                    </div>

                    <div id="resultado"></div>
                </section>

                <!-- SECCIÓN 2: LISTAR PEDIDOS -->
                <section style="margin-top: 40px;">
                    <h2 style="color: #333; margin-bottom: 20px;">📦 Mis Pedidos</h2>

                    <div class="button-group">
                        <button class="btn-secondary" onclick="cargarMisPedidos()">🔄 Recargar Pedidos</button>
                    </div>

                    <div id="pedidos-list" style="margin-top: 20px;">
                        <p style="color: #999;">Cargando...</p>
                    </div>
                </section>
            </div>
        </div>

        <a href="/pruebas/index.html" class="back-link">← Volver al menú</a>
    </div>

    <script src="/pruebas/helpers.js"></script>
    <script>
        let productosDisponibles = [];
        let productosSeleccionados = {};

        /**
         * Carga los productos disponibles para crear pedidos
         */
        async function cargarProductos() {
            const resultado = await apiFetch('/productos', 'GET');

            if (resultado.ok) {
                productosDisponibles = resultado.data;
                mostrarProductosFormulario();
            }
        }

        /**
         * Muestra los productos en el formulario de crear pedido
         */
        function mostrarProductosFormulario() {
            let html = '';

            productosDisponibles.forEach(p => {
                const inputId = `cantidad-${p.productoId}`;
                const disabled = p.stock === 0 ? 'disabled' : '';
                
                html += `
                    <div class="linea-item">
                        <div style="font-weight: bold; color: #ffa726;">#${p.productoId}</div>
                        <div>
                            <div style="font-weight: bold; color: #333;">${p.nombre}</div>
                            <div style="color: #666; font-size: 0.9em;">${p.descripcion}</div>
                            <div style="margin-top: 5px;">
                                <span style="color: #4caf50; font-weight: bold;">$${p.precio.toFixed(2)}</span>
                                <span style="margin-left: 15px; color: ${p.stock > 0 ? '#2e7d32' : '#c62828'}; font-weight: bold;">
                                    Stock: ${p.stock}
                                </span>
                            </div>
                        </div>
                        <div>
                            <input type="number" id="${inputId}" placeholder="Cant" value="0" min="0" max="${p.stock}" ${disabled} 
                                   style="width: 60px; padding: 8px;">
                        </div>
                    </div>
                `;
            });

            document.getElementById('lineas-list').innerHTML = html;
        }

        /**
         * Crea un nuevo pedido
         */
        async function crearPedido() {
            const direccion = document.getElementById('direccion-envio').value.trim();
            const observaciones = document.getElementById('observaciones').value.trim() || null;

            if (!direccion) {
                alert('❌ Ingresa una dirección de envío');
                return;
            }

            // Recopilar líneas
            const lineas = [];
            productosDisponibles.forEach(p => {
                const cantidad = parseInt(document.getElementById(`cantidad-${p.productoId}`).value) || 0;
                if (cantidad > 0) {
                    lineas.push({
                        productoId: p.productoId,
                        cantidad: cantidad
                    });
                }
            });

            if (lineas.length === 0) {
                alert('❌ Selecciona al menos un producto');
                return;
            }

            console.clear();
            console.group('🛒 CREAR PEDIDO REQUEST');
            console.log('Endpoint:', 'POST /pedidos');
            console.log('Body:', { direccionEnvio: direccion, observaciones, lineas });
            console.groupEnd();

            const resultado = await apiFetch('/pedidos', 'POST', {
                direccionEnvio: direccion,
                observaciones,
                lineas
            });

            if (resultado.ok) {
                console.group('🎉 PEDIDO CREADO');
                console.table(resultado.data);
                console.groupEnd();

                mostrarResultadoExito(`✅ Pedido #${resultado.data.pedidoId} creado exitosamente`);
                limpiarFormularioPedido();
                setTimeout(() => {
                    cargarMisPedidos();
                }, 1000);
            } else {
                mostrarResultadoError(`❌ Error: ${resultado.error}`);
            }
        }

        /**
         * Carga mis pedidos
         */
        async function cargarMisPedidos() {
            console.clear();
            console.group('📋 MIS PEDIDOS REQUEST');
            console.log('Endpoint:', 'GET /pedidos');
            console.groupEnd();

            const resultado = await apiFetch('/pedidos', 'GET');

            if (resultado.ok) {
                console.group('📋 PEDIDOS RESPONSE');
                console.table(resultado.data);
                console.groupEnd();

                mostrarPedidos(resultado.data);
            } else {
                document.getElementById('pedidos-list').innerHTML = `
                    <div style="color: #c62828; background: #ffebee; padding: 15px; border-radius: 5px;">
                        ❌ Error: ${resultado.error}
                    </div>
                `;
            }
        }

        /**
         * Muestra los pedidos
         */
        function mostrarPedidos(pedidos) {
            if (pedidos.length === 0) {
                document.getElementById('pedidos-list').innerHTML = '<p style="color: #999;">No tienes pedidos aún</p>';
                return;
            }

            let html = '';

            pedidos.forEach(p => {
                const estadoClass = `estado-${p.estado}`;

                html += `
                    <div class="pedido-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <h3>#Pedido ${p.pedidoId}</h3>
                            <button class="btn-secondary" onclick="cargarDetallePedido(${p.pedidoId})" style="padding: 8px 15px; font-size: 0.9em;">
                                👁️ Ver Detalle
                            </button>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px;">
                            <div>
                                <p><strong>Fecha:</strong> ${new Date(p.fecha).toLocaleDateString()}</p>
                                <p><strong>Estado:</strong> <span class="estado-badge ${estadoClass}">${p.estado}</span></p>
                            </div>
                            <div>
                                <p><strong>Dirección:</strong> ${p.direccionEnvio}</p>
                                <p><strong>Total:</strong> <span style="color: #4caf50; font-weight: bold;">$${p.total.toFixed(2)}</span></p>
                            </div>
                        </div>
                        ${p.observaciones ? `<p><strong>Observaciones:</strong> ${p.observaciones}</p>` : ''}
                    </div>
                `;
            });

            document.getElementById('pedidos-list').innerHTML = html;
        }

        /**
         * Carga el detalle de un pedido
         */
        async function cargarDetallePedido(pedidoId) {
            console.clear();
            console.group(`📦 DETALLE PEDIDO ${pedidoId} REQUEST`);
            console.log('Endpoint:', `GET /pedidos/${pedidoId}`);
            console.groupEnd();

            const resultado = await apiFetch(`/pedidos/${pedidoId}`, 'GET');

            if (resultado.ok) {
                console.group(`📦 DETALLE PEDIDO`);
                console.log('Cabecera:', resultado.data);
                console.log('Líneas:', resultado.data.lineas);
                console.table(resultado.data.lineas);
                console.groupEnd();

                mostrarDetallePedido(resultado.data);
            } else {
                alert(`❌ Error: ${resultado.error}`);
            }
        }

        /**
         * Muestra el detalle completo de un pedido
         */
        function mostrarDetallePedido(pedido) {
            let html = `
                <div style="background: white; padding: 20px; border-radius: 5px; margin-top: 20px;">
                    <h3 style="color: #ffa726; margin-bottom: 20px;">Detalle del Pedido #${pedido.pedidoId}</h3>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <p><strong>Fecha:</strong> ${new Date(pedido.fecha).toLocaleString()}</p>
                            <p><strong>Estado:</strong> <span class="estado-badge estado-${pedido.estado}">${pedido.estado}</span></p>
                            <p><strong>Dirección:</strong> ${pedido.direccionEnvio}</p>
                        </div>
                        <div>
                            <p><strong>Total:</strong> <span style="color: #4caf50; font-weight: bold; font-size: 1.2em;">$${pedido.total.toFixed(2)}</span></p>
                            ${pedido.observaciones ? `<p><strong>Observaciones:</strong> ${pedido.observaciones}</p>` : ''}
                        </div>
                    </div>

                    <h4 style="color: #333; margin: 20px 0 10px 0;">Líneas del Pedido:</h4>
                    <table>
                        <thead>
                            <tr>
                                <th>ID Línea</th>
                                <th>Producto</th>
                                <th>Precio Unit.</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            pedido.lineas.forEach(l => {
                html += `
                    <tr>
                        <td>#${l.lineaId}</td>
                        <td>${l.nombreProducto}</td>
                        <td>$${l.precioUnitario.toFixed(2)}</td>
                        <td>${l.cantidad}</td>
                        <td><strong>$${l.subtotal.toFixed(2)}</strong></td>
                        <td>
                            <button class="btn-secondary" onclick="editarLineaUI(${pedido.pedidoId}, ${l.lineaId}, ${l.cantidad})" style="padding: 5px 10px; font-size: 0.85em;">✏️ Editar</button>
                            <button class="btn-danger" onclick="eliminarLinea(${pedido.pedidoId}, ${l.lineaId})" style="padding: 5px 10px; font-size: 0.85em;">🗑️ Eliminar</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            alert(html);
        }

        /**
         * Muestra el mostrarResultadoExito
         */
        function mostrarResultadoExito(mensaje) {
            const div = document.getElementById('resultado');
            div.innerHTML = `<div style="background: #e8f5e9; border: 1px solid #4caf50; color: #2e7d32; padding: 15px; border-radius: 5px;">${mensaje}</div>`;
        }

        /**
         * Muestra el mostrarResultadoError
         */
        function mostrarResultadoError(mensaje) {
            const div = document.getElementById('resultado');
            div.innerHTML = `<div style="background: #ffebee; border: 1px solid #f44336; color: #c62828; padding: 15px; border-radius: 5px;">${mensaje}</div>`;
        }

        /**
         * Limpia el formulario
         */
        function limpiarFormularioPedido() {
            document.getElementById('direccion-envio').value = '';
            document.getElementById('observaciones').value = '';
            productosDisponibles.forEach(p => {
                document.getElementById(`cantidad-${p.productoId}`).value = '0';
            });
        }

        // Cargar al abrir
        window.addEventListener('load', () => {
            if (!tieneToken()) {
                alert('❌ Debes estar autenticado para ver esta página');
                window.location.href = '/pruebas/auth.html';
                return;
            }

            cargarProductos();
            cargarMisPedidos();
        });
    </script>
</body>
</html>
