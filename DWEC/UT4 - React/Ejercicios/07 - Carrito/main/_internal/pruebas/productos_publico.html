<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Públicos - Pruebas API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            margin-bottom: 20px;
        }

        header {
            background: linear-gradient(135deg, #26a69a 0%, #009688 100%);
            color: white;
            padding: 30px;
        }

        header h1 {
            margin-bottom: 10px;
        }

        .content {
            padding: 30px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #26a69a 0%, #009688 100%);
            color: white;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
        }

        #resultado {
            margin-top: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .product-card h3 {
            color: #26a69a;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .product-card p {
            color: #666;
            margin: 8px 0;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .product-card .price {
            font-size: 1.3em;
            color: #27ae60;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-card .stock {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        .stock.available {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .stock.low {
            background: #fff3e0;
            color: #e65100;
        }

        .stock.unavailable {
            background: #ffebee;
            color: #c62828;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        thead {
            background: #26a69a;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background: #f5f5f5;
        }

        .info-box {
            background: #e0f2f1;
            border: 1px solid #26a69a;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            color: #00695c;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #26a69a;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: 1fr;
            }

            .filter-group {
                flex-direction: column;
            }

            select, label {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <header>
                <h1>📦 Productos Públicos</h1>
                <p>Explora nuestro catálogo de productos (sin autenticación)</p>
            </header>

            <div class="content">
                <div class="info-box">
                    <strong>ℹ️ Este endpoint es público:</strong> No requiere autenticación. Los productos inactivos no se muestran.
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="cargarProductos('todos')">📦 Todos los Productos</button>
                    <button class="btn-secondary" onclick="cargarProductos('categorias')">🏷️ Por Categoría</button>
                </div>

                <div class="filter-group">
                    <label>
                        <input type="checkbox" id="incluir-inactivos" onchange="cargarProductos()">
                        Incluir inactivos (Solo interés didáctico)
                    </label>
                </div>

                <div id="resultado"></div>
            </div>
        </div>

        <a href="/pruebas/index.html" class="back-link">← Volver al menú</a>
    </div>

    <script src="/pruebas/helpers.js"></script>
    <script>
        /**
         * Carga los productos
         */
        async function cargarProductos(tipo = 'todos') {
            const incluirInactivos = document.getElementById('incluir-inactivos').checked;
            
            console.clear();
            console.group('📦 PRODUCTOS REQUEST');
            console.log('Endpoint:', 'GET /productos');
            console.log('Parámetros:', { activos_solo: !incluirInactivos });
            console.groupEnd();

            const resultado = await apiFetch(
                `/productos?activos_solo=${!incluirInactivos}`,
                'GET'
            );

            if (resultado.ok) {
                console.group('📦 PRODUCTOS RESPONSE');
                console.table(resultado.data);
                console.groupEnd();

                if (tipo === 'categorias') {
                    mostrarPorCategorias(resultado.data);
                } else {
                    mostrarTabla(resultado.data);
                }
            } else {
                document.getElementById('resultado').innerHTML = `
                    <div style="color: #c62828; background: #ffebee; padding: 15px; border-radius: 5px; border: 1px solid #f44336;">
                        ❌ Error al cargar productos: ${resultado.error}
                    </div>
                `;
            }
        }

        /**
         * Muestra los productos en una tabla
         */
        function mostrarTabla(productos) {
            if (productos.length === 0) {
                document.getElementById('resultado').innerHTML = '<p>No hay productos disponibles</p>';
                return;
            }

            let html = '<div class="table-container"><table>';
            html += '<thead><tr>';
            html += '<th>ID</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th>';
            html += '</tr></thead><tbody>';

            productos.forEach(p => {
                const stockClass = p.stock > 5 ? 'available' : (p.stock > 0 ? 'low' : 'unavailable');
                const stockText = p.stock > 0 ? `${p.stock} unidades` : 'Sin stock';
                const estado = p.activo ? '✅ Activo' : '❌ Inactivo';

                html += `<tr>`;
                html += `<td>${p.productoId}</td>`;
                html += `<td><strong>${p.nombre}</strong></td>`;
                html += `<td>${p.categoria}</td>`;
                html += `<td>$${p.precio.toFixed(2)}</td>`;
                html += `<td><span class="stock ${stockClass}">${stockText}</span></td>`;
                html += `<td>${estado}</td>`;
                html += `</tr>`;
            });

            html += '</tbody></table></div>';
            document.getElementById('resultado').innerHTML = html;
        }

        /**
         * Muestra los productos agrupados por categorías
         */
        function mostrarPorCategorias(productos) {
            const categorias = {};

            productos.forEach(p => {
                if (!categorias[p.categoria]) {
                    categorias[p.categoria] = [];
                }
                categorias[p.categoria].push(p);
            });

            let html = '';

            Object.entries(categorias).forEach(([categoria, items]) => {
                html += `<h3 style="color: #26a69a; margin-top: 30px; margin-bottom: 15px;">🏷️ ${categoria}</h3>`;
                html += '<div class="product-grid">';

                items.forEach(p => {
                    const stockClass = p.stock > 5 ? 'available' : (p.stock > 0 ? 'low' : 'unavailable');
                    const stockText = p.stock > 0 ? `${p.stock} unidades` : 'Sin stock';

                    html += `
                        <div class="product-card">
                            <h3>${p.nombre}</h3>
                            <p>${p.descripcion}</p>
                            <div class="price">$${p.precio.toFixed(2)}</div>
                            <span class="stock ${stockClass}">${stockText}</span>
                            <p style="margin-top: 10px; color: #999; font-size: 0.85em;">
                                ID: ${p.productoId} | Desde: ${p.fechaAlta}
                            </p>
                        </div>
                    `;
                });

                html += '</div>';
            });

            document.getElementById('resultado').innerHTML = html;
        }

        /**
         * Obtiene detalle de un producto
         */
        async function obtenerProducto(productoId) {
            console.clear();
            console.group(`📦 PRODUCTO ${productoId} REQUEST`);
            console.log('Endpoint:', `GET /productos/${productoId}`);
            console.groupEnd();

            const resultado = await apiFetch(`/productos/${productoId}`, 'GET');

            if (resultado.ok) {
                console.group(`📦 PRODUCTO DETALLE`);
                console.table(resultado.data);
                console.groupEnd();
                alert(JSON.stringify(resultado.data, null, 2));
            } else {
                alert(`Error: ${resultado.error}`);
            }
        }

        // Cargar al abrir la página
        window.addEventListener('load', () => {
            cargarProductos();
        });
    </script>
</body>
</html>
